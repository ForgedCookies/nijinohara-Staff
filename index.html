<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver's Timetable System</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --coral: #FF6B6B;
            --ocean: #4ECDC4;
            --sunshine: #FFE66D;
            --violet: #A8DADC;
            --midnight: #1A1A2E;
            --cloud: #F7F7F7;
            --slate: #2D3142;
            --success: #06D6A0;
            --alert: #FF8C42;
            --danger: #EF476F;
            
            --bg-primary: #F7F7F7;
            --bg-card: #FFFFFF;
            --text-primary: #1A1A2E;
            --text-secondary: #6B6B7B;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.12);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.16);
        }

        [data-theme="dark"] {
            --bg-primary: #1A1A2E;
            --bg-card: #2D3142;
            --text-primary: #F7F7F7;
            --text-secondary: #A8DADC;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
        }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
            line-height: 1.6;
        }

        /* Route Selection Interface */
        .route-selection {
            display: flex;
            height: 100vh;
            gap: 24px;
            padding: 24px;
            background: var(--bg-primary);
        }

        .route-list-panel {
            flex: 0 0 380px;
            background: var(--bg-card);
            border-radius: 0;
            padding: 28px;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-md);
            border: 2px solid var(--text-secondary);
        }

        .route-list-panel h2 {
            margin-bottom: 24px;
            color: var(--text-primary);
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .search-bar {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid var(--text-secondary);
            border-radius: 0;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 20px;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.2s ease;
        }

        .search-bar:focus {
            outline: none;
            border-color: var(--text-primary);
            box-shadow: none;
        }

        .route-buttons {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding-right: 8px;
        }

        .route-buttons::-webkit-scrollbar {
            width: 8px;
        }

        .route-buttons::-webkit-scrollbar-track {
            background: var(--bg-primary);
            border-radius: 0;
        }

        .route-buttons::-webkit-scrollbar-thumb {
            background: var(--text-secondary);
            border-radius: 0;
        }

        .route-btn {
            padding: 18px 20px;
            background: var(--bg-primary);
            border: 2px solid var(--text-secondary);
            border-radius: 0;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            font-family: 'DM Sans', sans-serif;
            transition: all 0.15s ease;
            position: relative;
            text-align: left;
        }

        .route-btn:hover {
            background: var(--text-primary);
            color: var(--bg-primary);
            border-color: var(--text-primary);
        }

        .route-btn.selected {
            background: var(--text-primary);
            color: var(--bg-primary);
            border-color: var(--text-primary);
        }

        .map-panel {
            flex: 1;
            background: var(--bg-card);
            border-radius: 0;
            padding: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-md);
            border: 2px solid var(--text-secondary);
        }

        .map-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--ocean) 0%, var(--violet) 100%);
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: 600;
        }

        .confirm-btn {
            margin-top: 28px;
            padding: 18px 48px;
            background: var(--text-primary);
            color: var(--bg-primary);
            border: 2px solid var(--text-primary);
            border-radius: 0;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .confirm-btn:hover {
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .confirm-btn:active {
            transform: none;
        }

        .confirm-btn:disabled {
            background: transparent;
            color: var(--text-secondary);
            border-color: var(--text-secondary);
            cursor: not-allowed;
            opacity: 0.5;
        }

        /* Timetable Interface */
        .timetable-interface {
            display: none;
            height: 100vh;
            padding: 24px;
            gap: 24px;
        }

        .timetable-interface.active {
            display: flex;
        }

        .timetable-panel {
            flex: 1;
            background: var(--bg-card);
            border-radius: 0;
            padding: 28px;
            overflow-y: auto;
            box-shadow: var(--shadow-md);
            border: 2px solid var(--text-secondary);
        }

        .timetable-panel::-webkit-scrollbar {
            width: 10px;
        }

        .timetable-panel::-webkit-scrollbar-track {
            background: var(--bg-primary);
            border-radius: 0;
        }

        .timetable-panel::-webkit-scrollbar-thumb {
            background: var(--text-secondary);
            border-radius: 0;
        }

        .accessories-panel {
            flex: 0 0 360px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .clock-card, .next-stop-card {
            background: var(--bg-card);
            border-radius: 0;
            padding: 24px;
            box-shadow: var(--shadow-md);
            border: 2px solid var(--text-secondary);
            transition: all 0.3s ease;
        }

        .clock-card h3 {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .clock-time {
            font-size: 40px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--ocean);
            font-family: 'Space Mono', monospace;
        }

        .clock-large {
            font-size: 52px;
        }

        .next-stop-card h3 {
            font-size: 14px;
            margin-bottom: 16px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .next-stop-info {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .next-stop-times {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .time-block {
            background: var(--bg-primary);
            padding: 16px;
            border-radius: 0;
            border: 2px solid var(--text-secondary);
        }

        .time-label {
            color: var(--text-secondary);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .time-value {
            font-size: 20px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text-primary);
            font-family: 'Space Mono', monospace;
        }

        .control-buttons {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .control-btn {
            position: relative;
            padding: 16px 20px;
            border: 2px solid var(--text-primary);
            border-radius: 0;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.15s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .control-btn:hover {
            background: var(--text-primary);
            color: var(--bg-primary);
        }

        .control-btn:active {
            transform: none;
        }

        .control-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .control-btn:disabled:hover {
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .btn-arrived {
            border-color: var(--success);
            color: var(--success);
        }

        .btn-arrived:hover:not(:disabled) {
            background: var(--success);
            color: white;
        }

        .btn-departed {
            border-color: var(--ocean);
            color: var(--ocean);
        }

        .btn-departed:hover:not(:disabled) {
            background: var(--ocean);
            color: white;
        }

        .btn-previous {
            border-color: var(--alert);
            color: var(--alert);
        }

        .btn-previous:hover:not(:disabled) {
            background: var(--alert);
            color: white;
        }

        .btn-end-shift {
            border-color: var(--danger);
            color: var(--danger);
        }

        .btn-end-shift:hover {
            background: var(--danger);
            color: white;
        }

        .btn-turnaround {
            border-color: var(--text-secondary);
            color: var(--text-secondary);
        }

        .btn-turnaround:hover:not(:disabled) {
            background: var(--text-secondary);
            color: var(--bg-primary);
        }

        .start-driving-btn {
            width: 100%;
            padding: 20px;
            background: var(--text-primary);
            color: var(--bg-primary);
            border: 2px solid var(--text-primary);
            border-radius: 0;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 24px;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .start-driving-btn:hover {
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .start-driving-btn:active {
            transform: none;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            background: var(--midnight);
            color: white;
            padding: 18px 16px;
            text-align: left;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 13px;
        }

        th:first-child {
            border-radius: 0;
        }

        th:last-child {
            border-radius: 0;
        }

        tbody tr {
            background: var(--bg-primary);
            transition: all 0.2s ease;
        }

        tbody tr:hover {
            transform: none;
            box-shadow: none;
            background: var(--bg-card);
        }

        td {
            padding: 18px 16px;
            border-top: 2px solid var(--bg-card);
            border-bottom: 2px solid var(--bg-card);
            font-size: 15px;
        }

        td:first-child {
            border-left: 2px solid var(--bg-card);
            border-radius: 0;
            font-weight: 600;
        }

        td:last-child {
            border-right: 2px solid var(--bg-card);
            border-radius: 0;
        }

        tr.current-stop {
            background: var(--sunshine);
        }

        tr.current-stop td {
            border-color: var(--coral);
            font-weight: 600;
        }

        tr.completed {
            opacity: 0.4;
        }

        .delta {
            font-weight: 700;
            font-size: 14px;
            padding: 4px 10px;
            border-radius: 0;
            display: inline-block;
            font-family: 'Space Mono', monospace;
            border: 1px solid;
        }

        .delta.early {
            background: transparent;
            color: var(--success);
            border-color: var(--success);
        }

        .delta.late {
            background: transparent;
            color: var(--danger);
            border-color: var(--danger);
        }

        .delta.ontime {
            background: transparent;
            color: var(--text-secondary);
            border-color: var(--text-secondary);
        }

        span.pass-label {
            font-weight: 700;
            color: white;
            background: var(--text-primary);
            padding: 4px 10px;
            border-radius: 0;
            margin-right: 10px;
            display: inline-block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .theme-toggle {
            position: fixed;
            top: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 0;
            background: var(--text-primary);
            color: var(--bg-primary);
            border: 2px solid var(--text-primary);
            cursor: pointer;
            font-size: 24px;
            z-index: 1000;
            box-shadow: var(--shadow-md);
            transition: all 0.2s ease;
        }

        .theme-toggle:hover {
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(26, 26, 46, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(4px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 32px;
            border-radius: 0;
            width: 90%;
            max-width: 550px;
            max-height: 70vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            border: 2px solid var(--text-primary);
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: var(--text-primary);
            font-size: 28px;
        }

        .modal-content pre {
            background: var(--bg-primary);
            padding: 20px;
            border-radius: 0;
            font-size: 14px;
            line-height: 1.8;
            border: 2px solid var(--text-secondary);
        }

        dialog#shiftReportDialog {
            border: 2px solid var(--text-primary);
            border-radius: 0;
            padding: 32px;
            max-width: 550px;
            width: 90%;
            background: var(--bg-card);
            color: var(--text-primary);
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            margin: 0;
            box-shadow: var(--shadow-lg);
        }

        dialog::backdrop {
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(4px);
        }

        dialog#shiftReportDialog h2 {
            margin-bottom: 20px;
            color: var(--text-primary);
            font-size: 28px;
            font-weight: 700;
        }

        dialog#shiftReportDialog pre {
            background: var(--bg-primary);
            padding: 20px;
            border-radius: 0;
            max-height: 320px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.8;
            white-space: pre-wrap;
            border: 2px solid var(--text-secondary);
            font-family: 'Space Mono', monospace;
        }

        dialog#shiftReportDialog menu {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 20px;
            padding: 0;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .route-selection {
                flex-direction: column;
                padding: 16px;
                gap: 16px;
            }

            .route-list-panel {
                flex: 0 0 auto;
                height: 50vh;
                padding: 20px;
            }

            .route-list-panel h2 {
                font-size: 24px;
            }

            .timetable-interface {
                flex-direction: column;
                height: 100vh;
                padding: 0;
                gap: 0;
                overflow: hidden;
            }

            .timetable-panel {
                flex: 1;
                order: 1;
                padding: 16px;
                overflow-x: auto;
                overflow-y: auto;
                border-radius: 0;
            }

            .accessories-panel {
                flex: 0 0 auto;
                order: 2;
                gap: 12px;
                padding: 16px;
                background: var(--bg-card);
                border-top: 3px solid var(--coral);
                box-shadow: 0 -4px 16px rgba(0,0,0,0.12);
                max-height: 50vh;
            }

            .start-driving-btn {
                font-size: 18px;
                padding: 16px;
                margin-bottom: 12px;
            }

            .clock-container {
                display: flex;
                gap: 12px;
            }

            .accessories-panel > .clock-card:first-child,
            .accessories-panel > .clock-card:nth-child(2) {
                flex: 1;
                padding: 12px;
            }

            .clock-card h3 {
                font-size: 9px;
                margin-bottom: 4px;
            }

            .clock-time {
                font-size: 20px;
            }

            .clock-large {
                font-size: 22px;
            }

            .next-stop-card {
                padding: 16px;
            }

            .next-stop-card h3 {
                font-size: 11px;
                margin-bottom: 8px;
            }

            .next-stop-info {
                font-size: 18px;
                margin-bottom: 12px;
            }

            .next-stop-times {
                gap: 8px;
                margin-bottom: 12px;
            }

            .time-block {
                padding: 10px;
            }

            .time-label {
                font-size: 9px;
            }

            .time-value {
                font-size: 14px;
            }

            .control-buttons {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .control-buttons .btn-arrived,
            .control-buttons .btn-departed {
                padding: 16px 12px;
                font-size: 14px;
            }

            .control-buttons .btn-previous {
                grid-column: 1 / -1;
                padding: 14px;
                font-size: 13px;
            }

            .control-btn {
                padding: 12px;
                font-size: 13px;
            }

            .btn-end-shift,
            .btn-turnaround {
                display: block;
                width: 100%;
                padding: 14px;
                font-size: 13px;
            }

            .btn-end-shift {
                margin-bottom: 10px;
            }

            th:nth-child(4), 
            td:nth-child(4),
            th:nth-child(5), 
            td:nth-child(5) {
                display: none;
            }

            th:nth-child(1), td:nth-child(1) { width: 35%; }
            th:nth-child(2), td:nth-child(2) { width: 22%; }
            th:nth-child(3), td:nth-child(3) { width: 22%; }
            th:nth-child(6), td:nth-child(6) { width: 21%; }

            .timetable-panel table {
                width: 100%;
                display: table;
                min-width: 100%;
            }

            th {
                padding: 12px 10px;
                font-size: 12px;
            }

            td {
                padding: 14px 10px;
                font-size: 14px;
            }

            td:nth-child(1) {
                font-size: 15px;
                font-weight: 700;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>

    <!-- Route Selection Interface -->
    <div class="route-selection" id="routeSelection">
        <div class="route-list-panel">
            <h2>Select Route</h2>
            <input type="text" class="search-bar" id="searchBar" placeholder="Search routes...">
            <div class="route-buttons" id="routeButtons"></div>
        </div>
        <div class="map-panel">
            <div class="map-placeholder" id="mapPlaceholder">
                Select a route to view map
            </div>
            <button class="confirm-btn" id="confirmBtn" disabled>Confirm Route</button>
        </div>
    </div>

    <!-- Timetable Interface -->
    <div class="timetable-interface" id="timetableInterface">
        <div class="timetable-panel">
            <button class="start-driving-btn" id="startDrivingBtn">Start Driving</button>
            <table id="timetableTable">
                <thead>
                    <tr>
                        <th>Station</th>
                        <th>Arrival Time</th>
                        <th>Departure Time</th>
                        <th>Δ Arrival</th>
                        <th>Δ Departure</th>
                        <th>Remarks</th>
                    </tr>
                </thead>
                <tbody id="timetableBody"></tbody>
            </table>
        </div>
        <div class="accessories-panel">
            <div class="clock-card">
                <h3>Local Time</h3>
                <div class="clock-time clock-large" id="localClock">00:00:00</div>
            </div>
            <div class="clock-card">
                <h3>Japan Standard Time</h3>
                <div class="clock-time" id="jstClock">00:00:00</div>
            </div>
            <div class="next-stop-card">
                <h3>Next Stop</h3>
                <div class="next-stop-info" id="nextStopName">---</div>
                <div class="next-stop-times">
                    <div class="time-block">
                        <div class="time-label">Arrival</div>
                        <div class="time-value" id="nextStopArrival">--:--:--</div>
                    </div>
                    <div class="time-block">
                        <div class="time-label">Departure</div>
                        <div class="time-value" id="nextStopDeparture">--:--:--</div>
                    </div>
                </div>
                <div class="control-buttons">
                    <button class="control-btn btn-arrived" id="arrivedBtn" disabled>Arrived</button>
                    <button class="control-btn btn-departed" id="departedBtn" disabled>Departed</button>
                    <button class="control-btn btn-previous" id="previousBtn" disabled>Previous Stop</button>
                    <button class="control-btn btn-end-shift" id="endShiftBtn">End Shift</button>
                    <button class="control-btn btn-turnaround" id="turnaroundBtn" disabled>Turnaround</button>
                </div>
            </div>
        </div>
    </div>

    <!-- End-of-shift dialog -->
    <dialog id="shiftReportDialog">
        <form method="dialog" style="display:flex; flex-direction:column; gap:16px;">
            <h2>End of Shift Report</h2>
            <pre id="shiftReportContent"></pre>
            <menu style="display:flex; justify-content:flex-end; gap:12px;">
                <button id="closeReportBtn" class="control-btn btn-arrived">Close</button>
            </menu>
        </form>
    </dialog>

    <script defer>
    let ROUTES = {};
    let selectedRoute = null;
    let selectedRouteData = null;
    let timetableData = [];
    let currentStopIndex = 0;
    let isDriving = false;

    async function loadRoutes() {
        try {
            const response = await fetch('routes.json');
            if (!response.ok) {
                throw new Error('Failed to load routes');
            }
            ROUTES = await response.json();
            initRoutes();
        } catch (error) {
            console.error('Error loading routes:', error);
            alert('Failed to load routes. Please refresh the page.');
        }
    }

    function initRoutes() {
        const container = document.getElementById('routeButtons');
        container.innerHTML = '';
        
        Object.keys(ROUTES).forEach(routeName => {
            const btn = document.createElement('button');
            btn.className = 'route-btn';
            btn.textContent = routeName;
            btn.onclick = () => selectRoute(routeName);
            container.appendChild(btn);
        });
    }

    function selectRoute(routeName) {
        selectedRoute = routeName;
        selectedRouteData = ROUTES[routeName];
        document.querySelectorAll('.route-btn').forEach(btn => {
            btn.classList.toggle('selected', btn.textContent === routeName);
        });
        document.getElementById('mapPlaceholder').textContent = `Map: ${routeName}`;
        document.getElementById('confirmBtn').disabled = false;
    }

    document.getElementById('confirmBtn').onclick = () => {
        if (selectedRoute) {
            document.getElementById('routeSelection').style.display = 'none';
            document.getElementById('timetableInterface').classList.add('active');
        }
    };

    document.getElementById('startDrivingBtn').onclick = () => {
        if (isDriving) return;
        isDriving = true;
        const now = new Date();
        generateTimetable(now);
        document.getElementById('startDrivingBtn').textContent = 'Driving...';
        document.getElementById('startDrivingBtn').style.background = 'var(--text-secondary)';
        document.getElementById('startDrivingBtn').style.borderColor = 'var(--text-secondary)';
        document.getElementById('startDrivingBtn').style.color = 'var(--bg-primary)';
        updateNextStop();
    };

    function generateTimetable(startTime) {
        const stops = selectedRouteData.stops;
        timetableData = [];
        let cumulativeTime = 0;

        stops.forEach((stop, i) => {
            cumulativeTime += stop.runningTime;
            const arrivalTime = new Date(startTime.getTime() + cumulativeTime * 1000);
            
            let departureTime = null;
            if (stop.isPass) {
                departureTime = new Date(arrivalTime);
            } else if (i < stops.length - 1) {
                const dwellTime = stop.dwellTime || 0;
                departureTime = new Date(arrivalTime.getTime() + dwellTime * 1000);
            }

            timetableData.push({
                station: stop.station,
                isPass: stop.isPass || false,
                scheduledArrival: roundTo15Seconds(arrivalTime),
                scheduledDeparture: departureTime ? roundTo15Seconds(departureTime) : null,
                actualArrival: null,
                actualDeparture: null,
                remarks: stop.remarks,
                dwellTime: stop.dwellTime || 0
            });
        });

        renderTimetable();
    }

    function roundTo15Seconds(date) {
        const seconds = date.getSeconds();
        const milliseconds = date.getMilliseconds();
        
        const remainder = seconds % 15;
        
        if (remainder === 0 && milliseconds === 0) {
            return new Date(date);
        }
        
        const secondsToAdd = 15 - remainder;
        const newDate = new Date(date);
        newDate.setSeconds(seconds + secondsToAdd, 0);
        
        return newDate;
    }

    function renderTimetable() {
        const tbody = document.getElementById('timetableBody');
        tbody.innerHTML = '';

        timetableData.forEach((stop, i) => {
            const row = tbody.insertRow();
            if (i === currentStopIndex) row.classList.add('current-stop');
            if (i < currentStopIndex) row.classList.add('completed');

            const stationCell = row.insertCell(0);
            if (stop.isPass) {
                stationCell.innerHTML = `<span class="pass-label">PASS</span>${stop.station}`;
            } else {
                stationCell.textContent = stop.station;
            }
            
            const arrivalCell = row.insertCell(1);
            if (i === 0) {
                arrivalCell.textContent = '---';
            } else if (stop.isPass) {
                arrivalCell.textContent = '---';
            } else {
                arrivalCell.textContent = formatTime(stop.scheduledArrival);
            }
            
            const departureCell = row.insertCell(2);
            if (i === timetableData.length - 1) {
                departureCell.textContent = '---';
            } else {
                departureCell.textContent = stop.scheduledDeparture ? formatTime(stop.scheduledDeparture) : '---';
            }
            
            const arrDelta = row.insertCell(3);
            const depDelta = row.insertCell(4);
            
            if (stop.actualArrival && !stop.isPass && i !== 0) {
                const delta = Math.round((stop.actualArrival - stop.scheduledArrival) / 1000);
                arrDelta.innerHTML = `<span class="delta ${delta < 0 ? 'early' : delta > 0 ? 'late' : 'ontime'}">${delta > 0 ? '+' : ''}${delta}s</span>`;
            }
            
            if (stop.actualDeparture && stop.scheduledDeparture && i !== timetableData.length - 1) {
                const delta = Math.round((stop.actualDeparture - stop.scheduledDeparture) / 1000);
                depDelta.innerHTML = `<span class="delta ${delta < 0 ? 'early' : delta > 0 ? 'late' : 'ontime'}">${delta > 0 ? '+' : ''}${delta}s</span>`;
            }
            
            row.insertCell(5).textContent = stop.remarks;
        });
    }

    function updateNextStop() {
        if (currentStopIndex >= timetableData.length) {
            document.getElementById('nextStopName').textContent = 'Journey Complete';
            document.getElementById('arrivedBtn').disabled = true;
            document.getElementById('departedBtn').disabled = true;
            document.getElementById('turnaroundBtn').disabled = false;
            return;
        }

        const stop = timetableData[currentStopIndex];
        
        const nextStopNameEl = document.getElementById('nextStopName');
        if (stop.isPass) {
            nextStopNameEl.innerHTML = `<span class="pass-label">PASS</span>${stop.station}`;
        } else {
            nextStopNameEl.textContent = stop.station;
        }
        
        if (stop.isPass) {
            document.getElementById('nextStopArrival').textContent = '---';
            document.getElementById('nextStopDeparture').textContent = formatTime(stop.scheduledDeparture);
        } else {
            document.getElementById('nextStopArrival').textContent = formatTime(stop.scheduledArrival);
            document.getElementById('nextStopDeparture').textContent = stop.scheduledDeparture ? formatTime(stop.scheduledDeparture) : '---';
        }
        
        if (stop.isPass) {
            document.getElementById('arrivedBtn').disabled = true;
            document.getElementById('departedBtn').disabled = false;
        } else {
            document.getElementById('arrivedBtn').disabled = false;
            document.getElementById('departedBtn').disabled = stop.actualArrival === null;
        }
        
        document.getElementById('previousBtn').disabled = currentStopIndex === 0;
    }

    document.getElementById('arrivedBtn').onclick = () => {
        if (currentStopIndex < timetableData.length) {
            const stop = timetableData[currentStopIndex];
            
            if (stop.isPass) return;
            
            timetableData[currentStopIndex].actualArrival = new Date();
            document.getElementById('departedBtn').disabled = false;
            renderTimetable();
        }
    };

    document.getElementById('departedBtn').onclick = () => {
        if (currentStopIndex < timetableData.length) {
            const stop = timetableData[currentStopIndex];
            
            if (stop.isPass) {
                timetableData[currentStopIndex].actualDeparture = new Date();
                timetableData[currentStopIndex].actualArrival = new Date();
            } else if (timetableData[currentStopIndex].actualArrival) {
                timetableData[currentStopIndex].actualDeparture = new Date();
            } else {
                return;
            }
            
            currentStopIndex++;
            renderTimetable();
            updateNextStop();
        }
    };

    document.getElementById('previousBtn').onclick = () => {
        if (currentStopIndex > 0) {
            currentStopIndex--;
            timetableData[currentStopIndex].actualDeparture = null;
            if (!timetableData[currentStopIndex].isPass) {
                timetableData[currentStopIndex].actualArrival = null;
            }
            document.getElementById('departedBtn').disabled = timetableData[currentStopIndex].isPass ? false : true;
            renderTimetable();
            updateNextStop();
        }
    };

    document.getElementById('turnaroundBtn').onclick = () => {
        if (!selectedRouteData) return;
        
        const turnaroundTime = selectedRouteData.turnaroundTime || 300;
        const turnaroundMinutes = Math.floor(turnaroundTime / 60);
        const turnaroundSeconds = turnaroundTime % 60;
        const timeString = turnaroundSeconds > 0 
            ? `${turnaroundMinutes} minutes ${turnaroundSeconds} seconds`
            : `${turnaroundMinutes} minutes`;
        
        const message = `Turnaround will begin in ${timeString}. Ready?`;
        
        if (!confirm(message)) return;
        
        document.getElementById('arrivedBtn').disabled = true;
        document.getElementById('departedBtn').disabled = true;
        document.getElementById('previousBtn').disabled = true;
        document.getElementById('turnaroundBtn').disabled = true;
        document.getElementById('nextStopName').textContent = `Turnaround in progress...`;
        document.getElementById('nextStopArrival').textContent = '--:--:--';
        document.getElementById('nextStopDeparture').textContent = '--:--:--';
        
        setTimeout(() => {
            const reversedStops = [...selectedRouteData.stops].reverse();
            selectedRouteData.stops = reversedStops;
            currentStopIndex = 0;
            isDriving = true;
            
            generateTimetable(new Date());
            renderTimetable();
            updateNextStop();
            
            alert('Turnaround complete! Starting return journey.');
        }, turnaroundTime * 1000);
    };

    function formatTime(date) {
        if (!date) return '---';
        return date.toLocaleTimeString('en-US', { hour12: false });
    }

    function updateClocks() {
        const now = new Date();
        document.getElementById('localClock').textContent = formatTime(now);
        
        const jst = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Tokyo' }));
        document.getElementById('jstClock').textContent = formatTime(jst);
    }

    function toggleTheme() {
        const html = document.documentElement;
        const currentTheme = html.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', newTheme);
        document.querySelector('.theme-toggle').textContent = newTheme === 'dark' ? '☀️' : '🌙';
    }

    document.getElementById('searchBar').oninput = (e) => {
        const search = e.target.value.toLowerCase();
        document.querySelectorAll('.route-btn').forEach(btn => {
            btn.style.display = btn.textContent.toLowerCase().includes(search) ? 'block' : 'none';
        });
    };

    function resetShiftState() {
        isDriving = false;
        currentStopIndex = 0;
        timetableData = [];

        document.getElementById('timetableInterface').classList.remove('active');
        document.getElementById('routeSelection').style.display = 'flex';

        document.getElementById('startDrivingBtn').textContent = 'Start Driving';
        document.getElementById('startDrivingBtn').style.background = 'var(--text-primary)';
        document.getElementById('startDrivingBtn').style.borderColor = 'var(--text-primary)';
        document.getElementById('startDrivingBtn').style.color = 'var(--bg-primary)';
        document.getElementById('arrivedBtn').disabled = true;
        document.getElementById('departedBtn').disabled = true;
        document.getElementById('previousBtn').disabled = true;
        document.getElementById('turnaroundBtn').disabled = true;
        
        loadRoutes();
    }

    document.getElementById('endShiftBtn').onclick = () => {
        if (!isDriving) return;

        if (!confirm('Are you sure you want to end your shift?')) return;

        const reportLines = timetableData.map(stop => {
            const stationName = stop.isPass ? `Pass ${stop.station}` : stop.station;
            return `${stationName}
    Arr: ${stop.actualArrival && !stop.isPass ? formatTime(stop.actualArrival) : '---'}
    Dep: ${stop.actualDeparture ? formatTime(stop.actualDeparture) : '---'}`;
        }).join('\n\n');

        document.getElementById('shiftReportContent').textContent = reportLines;

        const dialog = document.getElementById('shiftReportDialog');
        if (typeof dialog.showModal === "function") {
            dialog.showModal();
        } else {
            alert("Your browser does not support <dialog>. Report:\n\n" + reportLines);
            resetShiftState();
        }
    };

    document.getElementById('closeReportBtn').onclick = () => {
        const dialog = document.getElementById('shiftReportDialog');
        dialog.close();
        resetShiftState();
    };

    loadRoutes();
    setInterval(updateClocks, 100);
    updateClocks();
    </script>
</body>
</html>
