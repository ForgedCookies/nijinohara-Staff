<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver's Timetable System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f0f4f8;
            --bg-secondary: #ffffff;
            --bg-accent: #e3f2fd;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --border-color: #d1d9e0;
            --blue-primary: #1976d2;
            --blue-hover: #1565c0;
            --success: #4caf50;
            --warning: #ff9800;
        }

        [data-theme="dark"] {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-accent: #1c2938;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --border-color: #30363d;
            --blue-primary: #1e88e5;
            --blue-hover: #1976d2;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background 0.3s, color 0.3s;
        }

        /* Route Selection Interface */
        .route-selection {
            display: flex;
            height: 100vh;
            gap: 20px;
            padding: 20px;
        }

        .route-list-panel {
            flex: 0 0 350px;
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
        }

        .route-list-panel h2 {
            margin-bottom: 15px;
            color: var(--blue-primary);
        }

        .search-bar {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
            margin-bottom: 15px;
        }

        .route-buttons {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .route-btn {
            padding: 15px;
            background: var(--bg-accent);
            border: 2px solid var(--blue-primary);
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
            transition: all 0.2s;
        }

        .route-btn:hover {
            background: var(--blue-primary);
            color: white;
            transform: translateX(5px);
        }

        .route-btn.selected {
            background: var(--blue-primary);
            color: white;
        }

        .map-panel {
            flex: 1;
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
        }

        .map-placeholder {
            width: 100%;
            height: 100%;
            background: var(--bg-accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 18px;
        }

        .confirm-btn {
            margin-top: 20px;
            padding: 15px 40px;
            background: var(--blue-primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .confirm-btn:hover {
            background: var(--blue-hover);
        }

        .confirm-btn:disabled {
            background: var(--text-secondary);
            cursor: not-allowed;
        }

        /* Timetable Interface */
        .timetable-interface {
            display: none;
            height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        .timetable-interface.active {
            display: flex;
        }

        .timetable-panel {
            flex: 1;
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }

        .accessories-panel {
            flex: 0 0 320px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .clock-card, .next-stop-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }

        .clock-card h3 {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .clock-time {
            font-size: 36px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--blue-primary);
        }

        .clock-large {
            font-size: 48px;
        }

        .next-stop-card h3 {
            font-size: 18px;
            margin-bottom: 15px;
            color: var(--blue-primary);
        }

        .next-stop-info {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--text-primary);
        }

        .next-stop-times {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .time-label {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .time-value {
            font-size: 18px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .control-buttons {
            display: flex;
            flex-direction: column;
            gap: 16px; /* consistent spacing for all buttons */
        }


        .control-btn {
            position: relative;
            overflow: hidden;
            transition: transform 0.1s, box-shadow 0.1s;
            /* Add these missing properties: */
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .control-btn:active {
            transform: scale(0.97);
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.3);
        }



        .control-btn:disabled {
            background: var(--border-color);
            color: var(--text-secondary);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
            opacity: 0.6;
        }

        .btn-arrived {
            background: var(--success);
            color: white;
        }

        .btn-departed {
            background: var(--blue-primary);
            color: white;
        }

        .btn-previous {
            background: var(--warning);
            color: white;
        }

        .btn-end-shift {
            background: #9c27b0;
            color: white;
        }

        .btn-turnaround {
            background: #607d8b;
            color: white;
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .start-driving-btn {
            width: 100%;
            padding: 20px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .start-driving-btn:hover {
            background: #45a049;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--blue-primary);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        tr.current-stop {
            background: var(--bg-accent);
        }

        tr.completed {
            opacity: 0.5;
        }

        .delta {
            font-weight: 600;
            font-size: 14px;
        }

        .delta.early {
            color: var(--success);
        }

        .delta.late {
            color: #f44336;
        }

        .delta.ontime {
            color: var(--text-secondary);
        }

        span.pass-label {
            font-weight: 700 !important;
            color: #f44336 !important;
            background: rgba(244, 67, 54, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 8px;
            display: inline-block;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--blue-primary);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 24px;
            z-index: 1000;
        }

        @media (max-width: 768px) {
            .route-selection {
                flex-direction: column;
            }

            .route-list-panel {
                flex: 0 0 auto;
                height: 50vh;
            }

            .timetable-interface {
                flex-direction: column;
            }

            .accessories-panel {
                flex: 0 0 auto;
            }
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            margin-bottom: 12px;
        }

        .modal-content pre {
            background: var(--bg-accent);
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
        }

        dialog#shiftReportDialog {
            border: none;
            border-radius: 12px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            background: var(--bg-secondary);
            color: var(--text-primary);
            /* Add these centering properties: */
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            margin: 0;
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, 0.6);
        }

        dialog#shiftReportDialog h2 {
            margin-bottom: 16px;
            color: var(--blue-primary);
        }

        dialog#shiftReportDialog pre {
            background: var(--bg-accent);
            padding: 12px;
            border-radius: 8px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        dialog#shiftReportDialog menu {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 16px;
            padding: 0;
        }

        dialog#shiftReportDialog .control-btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

    <script defer>
    let ROUTES = {};
    let selectedRoute = null;
    let selectedRouteData = null; // Store full route data including turnaround time
    let timetableData = [];
    let currentStopIndex = 0;
    let isDriving = false;

    // Load routes from JSON file
    async function loadRoutes() {
        try {
            const response = await fetch('routes.json');
            if (!response.ok) {
                throw new Error('Failed to load routes');
            }
            ROUTES = await response.json();
            initRoutes();
        } catch (error) {
            console.error('Error loading routes:', error);
            alert('Failed to load routes. Please refresh the page.');
        }
    }

    // Initialize route selection
    function initRoutes() {
        const container = document.getElementById('routeButtons');
        container.innerHTML = ''; // Clear any existing buttons
        
        Object.keys(ROUTES).forEach(routeName => {
            const btn = document.createElement('button');
            btn.className = 'route-btn';
            btn.textContent = routeName;
            btn.onclick = () => selectRoute(routeName);
            container.appendChild(btn);
        });
    }

    function selectRoute(routeName) {
        selectedRoute = routeName;
        selectedRouteData = ROUTES[routeName]; // Store the full route data
        document.querySelectorAll('.route-btn').forEach(btn => {
            btn.classList.toggle('selected', btn.textContent === routeName);
        });
        document.getElementById('mapPlaceholder').textContent = `Map: ${routeName}`;
        document.getElementById('confirmBtn').disabled = false;
    }

    document.getElementById('confirmBtn').onclick = () => {
        if (selectedRoute) {
            document.getElementById('routeSelection').style.display = 'none';
            document.getElementById('timetableInterface').classList.add('active');
        }
    };

    document.getElementById('startDrivingBtn').onclick = () => {
        if (isDriving) return;
        isDriving = true;
        const now = new Date();
        generateTimetable(now);
        document.getElementById('startDrivingBtn').textContent = 'Driving...';
        document.getElementById('startDrivingBtn').style.background = '#666';
        updateNextStop();
    };

    function generateTimetable(startTime) {
        const stops = selectedRouteData.stops;
        timetableData = [];
        let cumulativeTime = 0;

        stops.forEach((stop, i) => {
            cumulativeTime += stop.runningTime;
            const arrivalTime = new Date(startTime.getTime() + cumulativeTime * 1000);
            
            // For passing stations, no dwell time and no arrival time shown
            let departureTime = null;
            if (stop.isPass) {
                // Passing station - departure time is same as arrival
                departureTime = new Date(arrivalTime);
            } else if (i < stops.length - 1) {
                // Regular stop - add dwell time
                const dwellTime = stop.dwellTime || 0;
                departureTime = new Date(arrivalTime.getTime() + dwellTime * 1000);
            }
            // Last stop has no departure time

            timetableData.push({
                station: stop.station,
                isPass: stop.isPass || false,
                scheduledArrival: roundTo15Seconds(arrivalTime),
                scheduledDeparture: departureTime ? roundTo15Seconds(departureTime) : null,
                actualArrival: null,
                actualDeparture: null,
                remarks: stop.remarks,
                dwellTime: stop.dwellTime || 0
            });
        });

        renderTimetable();
    }

    function roundTo15Seconds(date) {
        const seconds = date.getSeconds();
        const rounded = Math.round(seconds / 15) * 15;
        const newDate = new Date(date);
        newDate.setSeconds(rounded, 0);
        return newDate;
    }

    function renderTimetable() {
        const tbody = document.getElementById('timetableBody');
        tbody.innerHTML = '';

        timetableData.forEach((stop, i) => {
            const row = tbody.insertRow();
            if (i === currentStopIndex) row.classList.add('current-stop');
            if (i < currentStopIndex) row.classList.add('completed');

            // Station name with "[PASS]" prefix if it's a passing station
            const stationCell = row.insertCell(0);
            if (stop.isPass) {
                stationCell.innerHTML = `<span class="pass-label">[PASS]</span>${stop.station}`;
            } else {
                stationCell.textContent = stop.station;
            }
            
            // Arrival time - hide for passing stations
            const arrivalCell = row.insertCell(1);
            arrivalCell.textContent = stop.isPass ? '---' : formatTime(stop.scheduledArrival);
            
            // Departure time
            row.insertCell(2).textContent = stop.scheduledDeparture ? formatTime(stop.scheduledDeparture) : '---';
            
            const arrDelta = row.insertCell(3);
            const depDelta = row.insertCell(4);
            
            // Delta for arrival - only show if not passing station
            if (stop.actualArrival && !stop.isPass) {
                const delta = Math.round((stop.actualArrival - stop.scheduledArrival) / 1000);
                arrDelta.innerHTML = `<span class="delta ${delta < 0 ? 'early' : delta > 0 ? 'late' : 'ontime'}">${delta > 0 ? '+' : ''}${delta}s</span>`;
            }
            
            // Delta for departure
            if (stop.actualDeparture && stop.scheduledDeparture) {
                const delta = Math.round((stop.actualDeparture - stop.scheduledDeparture) / 1000);
                depDelta.innerHTML = `<span class="delta ${delta < 0 ? 'early' : delta > 0 ? 'late' : 'ontime'}">${delta > 0 ? '+' : ''}${delta}s</span>`;
            }
            
            row.insertCell(5).textContent = stop.remarks;
        });
    }

    function updateNextStop() {
    if (currentStopIndex >= timetableData.length) {
        document.getElementById('nextStopName').textContent = 'Journey Complete';
        document.getElementById('arrivedBtn').disabled = true;
        document.getElementById('departedBtn').disabled = true;
        document.getElementById('turnaroundBtn').disabled = false;
        return;
    }

    const stop = timetableData[currentStopIndex];
    
    // Display station name with [PASS] label if needed
    const nextStopNameEl = document.getElementById('nextStopName');
    if (stop.isPass) {
        nextStopNameEl.innerHTML = `<span class="pass-label">[PASS]</span>${stop.station}`;
    } else {
        nextStopNameEl.textContent = stop.station;
    }
    
    // For passing stations, show only departure time in both fields
    if (stop.isPass) {
        document.getElementById('nextStopArrival').textContent = '---';
        document.getElementById('nextStopDeparture').textContent = formatTime(stop.scheduledDeparture);
    } else {
        document.getElementById('nextStopArrival').textContent = formatTime(stop.scheduledArrival);
        document.getElementById('nextStopDeparture').textContent = stop.scheduledDeparture ? formatTime(stop.scheduledDeparture) : '---';
    }
    
    // For passing stations, skip arrival button
    if (stop.isPass) {
        document.getElementById('arrivedBtn').disabled = true;
        document.getElementById('departedBtn').disabled = false;
    } else {
        document.getElementById('arrivedBtn').disabled = false;
        document.getElementById('departedBtn').disabled = stop.actualArrival === null;
    }
    
    document.getElementById('previousBtn').disabled = currentStopIndex === 0;
    }

    document.getElementById('arrivedBtn').onclick = () => {
        if (currentStopIndex < timetableData.length) {
            const stop = timetableData[currentStopIndex];
            
            // Skip arrival for passing stations
            if (stop.isPass) return;
            
            timetableData[currentStopIndex].actualArrival = new Date();
            document.getElementById('departedBtn').disabled = false;
            renderTimetable();
        }
    };

    document.getElementById('departedBtn').onclick = () => {
        if (currentStopIndex < timetableData.length) {
            const stop = timetableData[currentStopIndex];
            
            // For passing stations, record departure directly
            if (stop.isPass) {
                timetableData[currentStopIndex].actualDeparture = new Date();
                // Also record arrival as same time for passing stations
                timetableData[currentStopIndex].actualArrival = new Date();
            } else if (timetableData[currentStopIndex].actualArrival) {
                timetableData[currentStopIndex].actualDeparture = new Date();
            } else {
                return; // Don't allow departure without arrival for regular stops
            }
            
            currentStopIndex++;
            renderTimetable();
            updateNextStop();
        }
    };

    document.getElementById('previousBtn').onclick = () => {
        if (currentStopIndex > 0) {
            currentStopIndex--;
            timetableData[currentStopIndex].actualDeparture = null;
            if (!timetableData[currentStopIndex].isPass) {
                timetableData[currentStopIndex].actualArrival = null;
            }
            document.getElementById('departedBtn').disabled = timetableData[currentStopIndex].isPass ? false : true;
            renderTimetable();
            updateNextStop();
        }
    };

    document.getElementById('turnaroundBtn').onclick = () => {
        if (!selectedRouteData) return;
        
        const turnaroundTime = selectedRouteData.turnaroundTime || 300; // Default 5 minutes
        const turnaroundMinutes = Math.floor(turnaroundTime / 60);
        const turnaroundSeconds = turnaroundTime % 60;
        const timeString = turnaroundSeconds > 0 
            ? `${turnaroundMinutes} minutes ${turnaroundSeconds} seconds`
            : `${turnaroundMinutes} minutes`;
        
        const message = `Turnaround will begin in ${timeString}. Ready?`;
        
        if (!confirm(message)) return;
        
        // Disable controls during turnaround
        document.getElementById('arrivedBtn').disabled = true;
        document.getElementById('departedBtn').disabled = true;
        document.getElementById('previousBtn').disabled = true;
        document.getElementById('turnaroundBtn').disabled = true;
        document.getElementById('nextStopName').textContent = `Turnaround in progress...`;
        document.getElementById('nextStopArrival').textContent = '--:--:--';
        document.getElementById('nextStopDeparture').textContent = '--:--:--';
        
        // Show countdown or wait
        setTimeout(() => {
            // Reverse the route stops
            const reversedStops = [...selectedRouteData.stops].reverse();
            
            // Update the route data temporarily
            selectedRouteData.stops = reversedStops;
            
            // Reset and start new journey
            currentStopIndex = 0;
            isDriving = true;
            
            generateTimetable(new Date());
            renderTimetable();
            updateNextStop();
            
            alert('Turnaround complete! Starting return journey.');
        }, turnaroundTime * 1000);
    };

    function formatTime(date) {
        if (!date) return '---';
        return date.toLocaleTimeString('en-US', { hour12: false });
    }

    function updateClocks() {
        const now = new Date();
        document.getElementById('localClock').textContent = formatTime(now);
        
        const jst = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Tokyo' }));
        document.getElementById('jstClock').textContent = formatTime(jst);
    }

    function toggleTheme() {
        const html = document.documentElement;
        const currentTheme = html.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', newTheme);
        document.querySelector('.theme-toggle').textContent = newTheme === 'dark' ? '☀️' : '🌙';
    }

    document.getElementById('searchBar').oninput = (e) => {
        const search = e.target.value.toLowerCase();
        document.querySelectorAll('.route-btn').forEach(btn => {
            btn.style.display = btn.textContent.toLowerCase().includes(search) ? 'block' : 'none';
        });
    };

    // Function to reset timetable state
    function resetShiftState() {
        isDriving = false;
        currentStopIndex = 0;
        timetableData = [];

        // Hide timetable interface, show main menu
        document.getElementById('timetableInterface').classList.remove('active');
        document.getElementById('routeSelection').style.display = 'flex';

        // Reset buttons
        document.getElementById('startDrivingBtn').textContent = 'Start Driving';
        document.getElementById('startDrivingBtn').style.background = 'var(--success)';
        document.getElementById('arrivedBtn').disabled = true;
        document.getElementById('departedBtn').disabled = true;
        document.getElementById('previousBtn').disabled = true;
        document.getElementById('turnaroundBtn').disabled = true;
        
        // Reload routes to restore original order
        loadRoutes();
    }

    // Show the end-of-shift report
    document.getElementById('endShiftBtn').onclick = () => {
        if (!isDriving) return;

        if (!confirm('Are you sure you want to end your shift?')) return;

        const reportLines = timetableData.map(stop => {
            const stationName = stop.isPass ? `Pass ${stop.station}` : stop.station;
            return `${stationName}
    Arr: ${stop.actualArrival && !stop.isPass ? formatTime(stop.actualArrival) : '---'}
    Dep: ${stop.actualDeparture ? formatTime(stop.actualDeparture) : '---'}`;
        }).join('\n\n');

        document.getElementById('shiftReportContent').textContent = reportLines;

        const dialog = document.getElementById('shiftReportDialog');
        if (typeof dialog.showModal === "function") {
            dialog.showModal();
        } else {
            alert("Your browser does not support <dialog>. Report:\n\n" + reportLines);
            resetShiftState();
        }
    };

    // Close dialog and reset state
    document.getElementById('closeReportBtn').onclick = () => {
        const dialog = document.getElementById('shiftReportDialog');
        dialog.close();
        resetShiftState();
    };

    // Load routes on page load
    loadRoutes();
    setInterval(updateClocks, 100);
    updateClocks();
</script>
    <!-- Modal for post-shift report (moved pre-script) -->
</div>
